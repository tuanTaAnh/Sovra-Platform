services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    env_file:
      - ../env/.env.docker
    environment:
      OLLAMA_KEEP_ALIVE: "-1"
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama

  ollama-init:
    image: curlimages/curl:8.10.1
    depends_on:
      - ollama
    env_file:
      - ../env/.env.docker
    volumes:
      - ./ollama-init.sh:/ollama-init.sh:ro
    entrypoint: ["/bin/sh", "/ollama-init.sh"]
    restart: "no"

volumes:
  ollama_data:

networks:
  default:
    name: sovra-net
    external: true