services:
  rag-service:
    build:
      context: ../../rag-service
      dockerfile: Dockerfile
    image: sovra-rag-service:local
    restart: unless-stopped
    env_file:
      - ../env/.env.docker
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      LLM_MODEL: ${LLM_MODEL:-llama3.2:1b}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-all-minilm}

      MILVUS_DB_PATH: ${MILVUS_DB_PATH:-/app/milvus/sovra_milvus.db}
      MILVUS_COLLECTION: ${MILVUS_COLLECTION:-sovra_knowledge_base}

      DEFAULT_TOP_K: ${DEFAULT_TOP_K:-3}
    volumes:
      - milvus_lite_data:/app/milvus
    ports:
      - "${RAG_SERVICE_PORT:-8001}:8001"

volumes:
  milvus_lite_data:
    name: sovra_milvus_lite_data

networks:
  default:
    name: sovra-net
    external: true